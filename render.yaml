# Render deployment blueprint.
# Docs: https://render.com/docs/blueprint-spec
#
# One service: a Cron Job that runs the full DAG pipeline once per
# scheduled tick, then exits. No standing background worker — this
# fits a daily-recap use case and avoids the paid-only "worker" service
# type entirely (cron jobs bill per-minute of actual run time, which
# for this pipeline is on the order of cents per month).
#
# To run on demand between scheduled ticks, either:
#   - Click "Trigger Run" on this cron job in the Render dashboard, or
#   - Click "Run now" on the web dashboard (queues a pending run that
#     gets picked up on the NEXT scheduled tick, not immediately)
#
# Env vars are marked sync: false — set their real values in the Render
# dashboard, don't commit them here. See worker/.env.example.

services:
  - type: cron
    name: investment-tracker-pipeline
    runtime: python
    rootDir: worker
    schedule: "0 21 * * 1-5" # weekdays, ~4pm ET after US market close (UTC, adjust for DST)
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
